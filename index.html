<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安的 AI 实验室 v7.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
    <style>
        :root { --pink: #FFD1DC; --purple: #E0BBE4; --text: #6D5D6E; }
        * { box-sizing: border-box; margin: 0; font-family: sans-serif; }
        body { background: #fdf5f7; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 430px; height: 100vh; background: #fff; position: relative; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, var(--pink), var(--purple)); padding: 25px 20px; color: white; border-bottom-left-radius: 30px; }
        #pet-container { position: absolute; right: 20px; bottom: 100px; text-align: center; z-index: 100; }
        .pet-body { width: 50px; height: 60px; background: white; border: 2px solid var(--text); border-radius: 25px; display: flex; justify-content: center; align-items: center; font-size: 20px; position: relative; }
        .pet-dialog { background: white; border: 1px solid var(--pink); padding: 5px; border-radius: 8px; font-size: 10px; margin-bottom: 5px; max-width: 100px; }
        #mol-container { width: 100%; height: 200px; background: #fafafa; border-radius: 20px; margin: 10px 0; position: relative; }
        .quiz-card { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 100px; }
        .bubble { background: #F5FFFA; border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid var(--purple); font-size: 14px; }
        .opt-btn { width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #eee; border-radius: 12px; background: #fff; text-align: left; cursor: pointer; }
        .correct { background: #e8f5e9 !important; border-color: #4caf50; }
        .wrong { background: #ffebee !important; border-color: #ef5350; }
        .action-bar { padding: 15px; display: flex; gap: 10px; background: white; position: absolute; bottom: 0; width: 100%; border-top: 1px solid #eee; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; }
        .btn-ai { background: var(--purple); } .btn-3d { background: var(--pink); }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); display: none; font-size: 12px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h3>安安的 AI 实验室 ✨</h3>
        <p style="font-size: 10px;">状态：DeepSeek 云端脑力已接入</p>
    </div>
    <div class="quiz-card">
        <div id="mol-container"><div id="loader">🧬 加载中...</div></div>
        <div id="quiz-space"><div class="bubble">准备好了吗？点击下方按钮，让 AI 为你实时出题！</div></div>
    </div>
    <div id="pet-container">
        <div class="pet-dialog" id="msg">主人加油！</div>
        <div class="pet-body">💊</div>
    </div>
    <div class="action-bar">
        <button class="btn btn-3d" onclick="load3D()">🔍 观察分子</button>
        <button class="btn btn-ai" id="ai-btn" onclick="askAI()">🧠 AI 联网出题</button>
    </div>
</div>

<script>
    const KEY = "sk-02023056be5f4dc79b3e1f73a169c9aa"; 
    let drug = null;
    let viewer = null;

    async function askAI() {
        const btn = document.getElementById('ai-btn');
        const space = document.getElementById('quiz-space');
        btn.disabled = true;
        document.getElementById('msg').innerText = "正在思考...";
        space.innerHTML = `<div class="bubble">AI 正在云端翻阅药典...</div>`;

        try {
            const res = await fetch("https://api.deepseek.com/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{role: "system", content: "药学专家出题。随机选一个重要西药出单选题，返回JSON格式：{name:'药名', cid:'PubChem CID', q:'题目', opts:['A','B','C','D'], a:'正确选项文字'}"}],
                    response_format: { type: "json_object" }
                })
            });
            const data = await res.json();
            const quiz = JSON.parse(data.choices[0].message.content);
            drug = { name: quiz.name, cid: quiz.cid };

            space.innerHTML = `
                <div class="bubble"><b>[考点]</b><br>${quiz.q}</div>
                ${quiz.opts.map(o => `<button class="opt-btn" onclick="check(this, '${o}'==='${quiz.a}', '${quiz.a}')">${o}</button>`).join('')}
            `;
            document.getElementById('msg').innerText = "出好啦！";
        } catch (e) {
            space.innerHTML = `<div class="bubble">连接失败，请重试。</div>`;
        } finally { btn.disabled = false; }
    }

    function check(btn, isRight, a) {
        if(isRight) { btn.classList.add('correct'); document.getElementById('msg').innerText = "真棒！"; }
        else { btn.classList.add('wrong'); document.getElementById('msg').innerText = "答案是:"+a; }
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    }

    async function load3D() {
        if(!drug) return alert("先请 AI 出题");
        document.getElementById('loader').style.display = 'block';
        const box = document.getElementById('mol-container');
        const old = box.querySelector('canvas'); if(old) old.remove();
        try {
            const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${drug.cid}/record/SDF/?record_type=3d`);
            const sdf = await res.text();
            viewer = $3Dmol.createViewer(box, { backgroundColor: 'white' });
            viewer.addModel(sdf, "sdf");
            viewer.setStyle({}, {stick: {color: 'spectrum', radius: 0.25}});
            viewer.zoomTo(); viewer.render(); viewer.spin(true);
        } catch (e) { alert("3D加载失败"); }
        finally { document.getElementById('loader').style.display = 'none'; }
    }
</script>
</body>
</html>
