<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安的无限题库实验室 v11.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
    <style>
        :root { --pink: #FFD1DC; --purple: #E0BBE4; --bg: #f8f9fa; --card: #ffffff; }
        * { box-sizing: border-box; font-family: 'PingFang SC', sans-serif; }
        body { background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { 
            width: 100%; max-width: 500px; background: linear-gradient(135deg, var(--pink), var(--purple));
            padding: 20px; color: white; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        #quiz-list { width: 100%; max-width: 500px; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .quiz-card { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
        .quiz-q { font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #333; }
        .opt-btn { 
            width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px; 
            background: white; text-align: left; cursor: pointer; margin-bottom: 8px;
        }
        .correct { background: #e8f5e9 !important; border-color: #4caf50 !important; color: #2e7d32; font-weight: bold; }
        .wrong { background: #ffebee !important; border-color: #f44336 !important; color: #c62828; }
        .mol-view { width: 100%; height: 200px; background: #fafafa; border-radius: 15px; margin-top: 15px; display: none; }
        .batch-btn {
            width: 80%; max-width: 300px; padding: 15px; background: var(--purple);
            color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold;
            margin: 20px 0 40px; cursor: pointer; box-shadow: 0 5px 15px rgba(224,187,228,0.5);
        }
        #loader { text-align: center; color: var(--purple); font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0">安安的无限题库 ✨</h2>
    <p style="font-size: 12px; opacity: 0.9;">每次点击都会从阿里星系随机抓取新考题</p>
</div>

<div id="quiz-list">
    <p style="text-align:center; color:#999; margin-top:50px;">实验室待命，准备好连抽了吗？</p>
</div>

<div id="loader">🚀 正在穿越题海，为你挑选新题目...</div>

<button class="batch-btn" id="gen-btn" onclick="generateBatch()">🔥 开启 AI 随机五连抽</button>

<script>
    const API_KEY = "sk-9c2b3a4d7e574bb69ba15f2b5b1b7f45";

    async function generateBatch() {
        const btn = document.getElementById('gen-btn');
        const loader = document.getElementById('loader');
        btn.disabled = true;
        loader.style.display = 'block';

        // 杠杆：生成一个随机盐值，迫使 AI 产生不同结果
        const randomSalt = Math.random().toString(36).substring(7);
        const categories = ["抗生素", "心血管系统", "中枢神经系统", "内分泌", "消化系统", "药事管理"];
        const randomCat = categories[Math.floor(Math.random() * categories.length)];

        try {
            const response = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                body: JSON.stringify({
                    model: "qwen-plus",
                    messages: [{
                        role: "system", 
                        content: `你是一个不重复出题的药学专家。当前的随机种子是：${randomSalt}。请从【${randomCat}】类别或随机选择药师考纲药名，一次性出5道不同的选择题。返回严格JSON格式：{"list": [{"drug":"药名", "cid":"CID数字", "q":"题目", "opts":["A", "B", "C", "D"], "a":"正确答案"}]}`
                    }],
                    // 杠杆：调高随机性温度，避免模型保守
                    temperature: 0.85 
                })
            });

            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);
            renderQuizzes(result.list);
        } catch (e) {
            alert("可能阿里大脑短路了，再点一次试试！");
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function renderQuizzes(list) {
        const container = document.getElementById('quiz-list');
        if(container.innerText.includes("待命")) container.innerHTML = "";

        list.forEach((item, index) => {
            const cardId = `card-${Date.now()}-${index}`;
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.innerHTML = `
                <div class="quiz-q">${item.q}</div>
                <div id="opts-${cardId}">
                    ${item.opts.map(o => `<button class="opt-btn" onclick="checkAnswer(this, '${o}', '${item.a}', '${cardId}')">${o}</button>`).join('')}
                </div>
                <div id="mol-view-${cardId}" class="mol-view"></div>
                <button style="margin-top:10px; border:none; background:none; color:var(--purple); cursor:pointer; font-size:12px;" onclick="showMol('${item.cid}', '${cardId}')">🔬 查看分子模型</button>
            `;
            container.prepend(card);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function checkAnswer(btn, selected, correct, cardId) {
        const parent = document.getElementById(`opts-${cardId}`);
        const buttons = parent.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.disabled = true);
        if(selected === correct) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
        }
    }

    async function showMol(cid, cardId) {
        const view = document.getElementById(`mol-view-${cardId}`);
        view.style.display = 'block';
        view.innerHTML = "载入中...";
        try {
            const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/record/SDF/?record_type=3d`);
            const sdf = await res.text();
            view.innerHTML = "";
            let viewer = $3Dmol.createViewer(view, { backgroundColor: 'white' });
            viewer.addModel(sdf, "sdf");
            viewer.setStyle({}, {stick: {color: 'spectrum', radius: 0.2}});
            viewer.zoomTo(); viewer.render(); viewer.spin(true);
        } catch (e) { view.innerHTML = "无模型"; }
    }
</script>
</body>
</html>
