<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安安的 AI 药学导师 v9.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
    <style>
        :root { --p: #FFD1DC; --v: #E0BBE4; --bg: #fdf5f7; --card: #fff; --txt: #444; }
        .dark { --p: #ff8fa3; --v: #9d81a1; --bg: #1a1a2e; --card: #252545; --txt: #e0e0e0; }
        * { box-sizing: border-box; transition: 0.3s; font-family: 'PingFang SC', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; margin: 0; color: var(--txt); }
        .app { width: 100%; max-width: 430px; height: 100vh; background: var(--card); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 顶部仪表盘 */
        .stats-header { background: linear-gradient(135deg, var(--p), var(--v)); padding: 20px; color: white; border-bottom-left-radius: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; font-size: 12px; text-align: center; }
        .stat-item { background: rgba(255,255,255,0.2); padding: 5px; border-radius: 10px; }

        /* 3D 容器 */
        #mol-container { width: 100%; height: 200px; background: rgba(0,0,0,0.05); border-radius: 20px; margin: 10px 0; position: relative; }
        .quiz-area { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 120px; }
        
        /* AI 对话气泡 */
        .bubble { background: var(--v); color: white; padding: 15px; border-radius: 20px 20px 20px 5px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .explain-box { background: rgba(0,0,0,0.03); border-left: 4px solid var(--p); padding: 10px; margin-top: 10px; font-size: 12px; display: none; }

        /* 选项 */
        .opt { width: 100%; padding: 12px; margin-bottom: 8px; border: 2px solid #eee; border-radius: 15px; background: var(--card); color: var(--txt); text-align: left; cursor: pointer; font-weight: 500; }
        .correct { background: #4caf50 !important; color: white; border-color: #4caf50; }
        .wrong { background: #ff5252 !important; color: white; border-color: #ff5252; }

        /* 浮动丹丹 */
        #pet { position: absolute; right: 20px; bottom: 120px; z-index: 100; text-align: center; }
        .pet-img { font-size: 40px; animation: bounce 2s infinite; cursor: pointer; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 底部控制栏 */
        .bar { position: absolute; bottom: 0; width: 100%; padding: 15px; display: flex; gap: 10px; background: var(--card); border-top: 1px solid #eee; }
        .btn { flex: 1; border: none; padding: 15px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-ai { background: var(--v); }
        .btn-3d { background: var(--p); }
        .theme-toggle { position: absolute; top: 20px; right: 20px; font-size: 20px; cursor: pointer; z-index: 20; }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
    
    <div class="stats-header">
        <h3 style="margin:0">安安的学习元宇宙</h3>
        <div class="stats-grid">
            <div class="stat-item">积分: <span id="score">0</span></div>
            <div class="stat-item">胜率: <span id="rate">0%</span></div>
            <div class="stat-item">连击: <span id="streak">0</span></div>
        </div>
    </div>

    <div class="quiz-area">
        <div id="mol-container"></div>
        <div id="quiz-space">
            <div class="bubble">丹丹已经进化了！我会记录你的每一步成长。准备好接受 AI 药理学挑战了吗？</div>
        </div>
        <div id="explain" class="explain-box"></div>
    </div>

    <div id="pet">
        <div class="pet-dialog" id="msg" style="font-size:10px; background:white; border-radius:5px; padding:2px">等考题中...</div>
        <div class="pet-img" id="pet-emoji">🐣</div>
    </div>

    <div class="bar">
        <button class="btn btn-3d" onclick="load3D()">🔬 结构</button>
        <button class="btn btn-ai" id="ask-btn" onclick="askAI()">🧠 AI 生题</button>
        <button id="why-btn" class="btn" style="background:#888; display:none" onclick="askWhy()">❓ 讲解</button>
    </div>
</div>

<script>
    // 配置
    const KEY = "sk-9c2b3a4d7e574bb69ba15f2b5b1b7f45"; // 你的阿里Key
    let state = JSON.parse(localStorage.getItem('anan_v9_state')) || { score: 0, total: 0, right: 0, streak: 0 };
    let cur = null;

    // 初始化显示
    updateUI();

    function updateUI() {
        document.getElementById('score').innerText = state.score;
        document.getElementById('streak').innerText = state.streak;
        const rate = state.total === 0 ? 0 : Math.round((state.right / state.total) * 100);
        document.getElementById('rate').innerText = rate + '%';
        
        // 宠物进化逻辑
        const emoji = document.getElementById('pet-emoji');
        if (state.score < 50) emoji.innerText = '🐣';
        else if (state.score < 200) emoji.innerText = '🐥';
        else if (state.score < 500) emoji.innerText = '🦢';
        else emoji.innerText = '🐉';
        
        localStorage.setItem('anan_v9_state', JSON.stringify(state));
    }

    function toggleTheme() { document.getElementById('app').classList.toggle('dark'); }

    async function askAI() {
        const btn = document.getElementById('ask-btn');
        btn.disabled = true;
        document.getElementById('msg').innerText = "脑暴中...";
        document.getElementById('explain').style.display = 'none';
        document.getElementById('why-btn').style.display = 'none';

        try {
            const res = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${KEY}` },
                body: JSON.stringify({
                    model: "qwen-plus",
                    messages: [{role: "system", content: "出药学选择题。返回JSON：{drug:'药名', cid:'CID', q:'题', opts:['A','B','C','D'], a:'答案', e:'解析'}"}],
                    response_format: { type: "json_object" }
                })
            });
            const d = await res.json();
            cur = JSON.parse(d.choices[0].message.content);
            
            document.getElementById('quiz-space').innerHTML = `
                <div class="bubble"><b>[挑战]</b><br>${cur.q}</div>
                ${cur.opts.map(o => `<button class="opt" onclick="check(this, '${o}'==='${cur.a}')">${o}</button>`).join('')}
            `;
            document.getElementById('msg').innerText = "出好啦！";
        } catch (err) { alert("网络波动，再试一次"); }
        finally { btn.disabled = false; }
    }

    function check(btn, isRight) {
        document.querySelectorAll('.opt').forEach(b => b.disabled = true);
        state.total++;
        if(isRight) {
            btn.classList.add('correct');
            state.score += 10 + state.streak;
            state.right++;
            state.streak++;
            document.getElementById('msg').innerText = "连击！+" + (10+state.streak);
        } else {
            btn.classList.add('wrong');
            state.streak = 0;
            document.getElementById('msg').innerText = "断了呜呜";
            document.getElementById('why-btn').style.display = 'block';
        }
        updateUI();
    }

    function askWhy() {
        const box = document.getElementById('explain');
        box.innerHTML = `<b>导师解析：</b><br>${cur.e}`;
        box.style.display = 'block';
    }

    async function load3D() {
        if(!cur) return;
        const box = document.getElementById('mol-container');
        box.innerHTML = "载入中...";
        try {
            const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cur.cid}/record/SDF/?record_type=3d`);
            const sdf = await res.text();
            box.innerHTML = "";
            let v = $3Dmol.createViewer(box, { backgroundColor: 'transparent' });
            v.addModel(sdf, "sdf");
            v.setStyle({}, {stick: {color: 'spectrum', radius: 0.2}});
            v.zoomTo(); v.render(); v.spin(true);
        } catch (e) { box.innerHTML = "无3D数据"; }
    }
</script>
</body>
</html>
